<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘塔羅占卜</title>
  <style>
    :root { --ink:#100d1d; --night:#19132b; --panel:rgba(29,22,51,.78); --panel-strong:#241b40; --line:rgba(238,216,169,.18); --gold:#ecc879; --cream:#fffaf0; --lilac:#c9b9ff; --muted:#bcb3d0; --mint:#a9ead5; --danger:#ff9fb5; --shadow:0 30px 80px rgba(4,2,15,.45); }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",Georgia,serif; color:var(--cream); background:var(--ink); scroll-behavior:smooth; }
    body { overflow-x:hidden; background:radial-gradient(circle at 9% 1%,#5c4794 0,transparent 25rem),radial-gradient(circle at 88% 17%,#253c67 0,transparent 27rem),linear-gradient(145deg,#100d1d 0%,#171128 54%,#090813 100%); }
    body::before,body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:0; }
    body::before { opacity:.55; background-image:radial-gradient(circle,rgba(255,255,255,.88) 0 1px,transparent 1.3px),radial-gradient(circle,rgba(255,255,255,.46) 0 1px,transparent 1.2px); background-position:15px 24px,133px 91px; background-size:173px 173px,251px 251px; mask-image:linear-gradient(to bottom,black,transparent 84%); }
    body::after { background:linear-gradient(90deg,transparent,rgba(239,209,147,.035),transparent); opacity:.6; }
    .shell { position:relative; z-index:1; width:min(1180px,calc(100% - 40px)); margin:0 auto; padding:24px 0 64px; }
    .site-nav { display:flex; align-items:center; justify-content:space-between; padding:0 4px; }
    .brand { display:inline-flex; align-items:center; gap:10px; color:var(--cream); text-decoration:none; font-size:14px; letter-spacing:.13em; }
    .brand-mark { display:grid; place-items:center; width:34px; height:34px; border:1px solid rgba(236,200,121,.55); border-radius:50%; color:var(--gold); font-size:19px; box-shadow:inset 0 0 16px rgba(236,200,121,.11); }
    .nav-note { color:var(--muted); font-family:Arial,sans-serif; font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
    .hero { position:relative; max-width:850px; margin:0 auto; text-align:center; padding:84px 24px 58px; }
    .hero::before { content:""; position:absolute; width:390px; height:390px; top:1px; left:50%; transform:translateX(-50%); border:1px solid rgba(236,200,121,.12); border-radius:50%; box-shadow:0 0 0 38px rgba(236,200,121,.024),0 0 0 92px rgba(201,185,255,.018); }
    .eyebrow { position:relative; display:inline-flex; align-items:center; gap:9px; padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.04); color:var(--gold); font-family:Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:.2em; }
    .eyebrow::before { content:"✦"; font-size:12px; }
    h1 { position:relative; display:flex; justify-content:center; margin:22px 0 14px; font-size:clamp(54px,8.5vw,100px); line-height:.93; letter-spacing:.08em; font-weight:600; color:transparent; background:linear-gradient(180deg,#fffdf7 5%,#f6dfb4 49%,#cc9a49 100%); -webkit-background-clip:text; background-clip:text; text-shadow:0 0 35px rgba(239,209,147,.1); }
    .title-glyph { display:inline-block; color:transparent; background:inherit; -webkit-background-clip:text; background-clip:text; animation:splitReveal .78s cubic-bezier(.22,.78,.2,1) both; animation-delay:calc(var(--glyph-index) * 95ms + 120ms); }
    .subtitle { position:relative; max-width:610px; margin:0 auto; color:var(--muted); font-size:15px; line-height:2; }
    .grid { display:grid; grid-template-columns:minmax(0,1.03fr) minmax(430px,.97fr); gap:24px; align-items:start; }
    .panel { position:relative; background:linear-gradient(140deg,rgba(43,33,75,.85),rgba(20,16,37,.84)); border:1px solid rgba(255,255,255,.09); border-radius:30px; box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.05); backdrop-filter:blur(20px); overflow:hidden; }
    .panel::before { content:""; position:absolute; width:240px; height:240px; right:-100px; top:-120px; border-radius:50%; background:radial-gradient(circle,rgba(201,185,255,.14),transparent 68%); pointer-events:none; }
    .panel-inner,.ritual { position:relative; padding:34px; }
    .section-kicker { margin:0 0 10px; color:var(--gold); font-family:Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:.18em; }
    .panel-title { margin:0 0 9px; color:var(--cream); font-size:28px; letter-spacing:.04em; }
    .panel-copy,.footer-note { margin:0 0 28px; color:var(--muted); line-height:1.85; font-size:14px; }
    .field { margin-bottom:23px; }
    .field label { display:block; margin-bottom:10px; color:#e9ddc5; font-family:Arial,sans-serif; font-size:11px; font-weight:700; letter-spacing:.13em; }
    select,textarea,button { font:inherit; }
    select,textarea { width:100%; border:1px solid rgba(255,255,255,.1); border-radius:16px; background:rgba(8,6,18,.53); color:var(--cream); padding:15px 16px; outline:none; transition:border-color .25s,box-shadow .25s,background .25s; }
    select:focus,textarea:focus { border-color:rgba(236,200,121,.58); background:rgba(8,6,18,.75); box-shadow:0 0 0 4px rgba(236,200,121,.08); }
    textarea { min-height:126px; resize:vertical; line-height:1.8; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .chip { border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.035); color:var(--muted); border-radius:999px; padding:8px 13px; cursor:pointer; }
    .chip,.question-item,.button,.reading-box,.card { transition:transform .3s ease,opacity .3s ease,border-color .3s ease,background .3s ease,box-shadow .3s ease; }
    .chip:hover,.chip.active { color:var(--cream); border-color:rgba(236,200,121,.45); background:rgba(236,200,121,.12); }
    .question-list { display:grid; gap:8px; max-height:210px; overflow:auto; padding-right:4px; }
    .question-list::-webkit-scrollbar { width:5px; }.question-list::-webkit-scrollbar-thumb { background:rgba(236,200,121,.28); border-radius:99px; }
    .question-item { width:100%; border:1px solid rgba(255,255,255,.075); background:rgba(255,255,255,.025); color:#e9e2f1; padding:12px 14px; border-radius:13px; text-align:left; font-size:13px; line-height:1.55; cursor:pointer; }
    .question-item:hover { transform:translateX(3px); border-color:rgba(201,185,255,.45); background:rgba(201,185,255,.08); }
    .spread-meta { display:grid; grid-template-columns:.52fr 1.48fr; gap:10px; margin-top:22px; }
    .meta-card,.reading-box { background:rgba(5,4,13,.28); border:1px solid rgba(255,255,255,.075); border-radius:16px; padding:14px 16px; }
    .meta-label { color:var(--muted); font-family:Arial,sans-serif; font-size:10px; letter-spacing:.1em; }.meta-value { margin-top:7px; color:var(--gold); font-size:14px; }
    .actions { display:flex; flex-wrap:wrap; gap:11px; margin-top:24px; }.button { border:0; border-radius:14px; padding:14px 18px; cursor:pointer; }.button-primary { flex:1; min-width:190px; color:#271907; font-weight:700; background:linear-gradient(135deg,#ffe5a5,#e4ae55 55%,#ba7932); box-shadow:0 12px 28px rgba(196,137,49,.22); }.special-button { position:relative; isolation:isolate; overflow:hidden; background:#141022; color:var(--cream); box-shadow:0 0 0 1px rgba(236,200,121,.5),0 12px 28px rgba(3,1,14,.34); }.special-button::before { content:""; position:absolute; z-index:-2; inset:-2px; border-radius:inherit; background:conic-gradient(from 180deg,transparent 0deg,transparent 68deg,#ffe8ad 108deg,#aa82ff 147deg,transparent 188deg,transparent 360deg); animation:borderOrbit 4.6s linear infinite; }.special-button::after { content:""; position:absolute; z-index:-1; inset:2px; border-radius:12px; background:linear-gradient(110deg,#291e45,#171026 46%,#2d214a); }.special-button .button-text { position:relative; z-index:1; letter-spacing:.08em; }.special-button .button-spark { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--gold); font-size:16px; transition:transform .35s ease; }.special-button:hover:not([disabled]) { box-shadow:0 0 0 1px rgba(255,230,171,.8),0 0 30px rgba(201,185,255,.25),0 16px 28px rgba(3,1,14,.45); }.special-button:hover:not([disabled]) .button-spark { transform:translateY(-50%) rotate(90deg) scale(1.2); }.special-button.is-drawing::before { animation-duration:1s; }.button-secondary { color:var(--cream); background:rgba(255,255,255,.065); border:1px solid rgba(255,255,255,.1); }.button[disabled]{opacity:.65;cursor:wait}.button:hover:not([disabled]){transform:translateY(-2px);box-shadow:0 16px 28px rgba(0,0,0,.23)}
    .ritual { min-height:700px; display:flex; flex-direction:column; gap:20px; }.ritual::before { content:""; position:absolute; inset:15px; border:1px solid rgba(236,200,121,.1); border-radius:23px; pointer-events:none; }.ritual::after { content:""; position:absolute; right:22px; bottom:110px; width:190px; height:190px; background:radial-gradient(circle,rgba(169,234,213,.16),transparent 68%); filter:blur(14px); opacity:0; pointer-events:none; transition:opacity .5s ease; }.ritual.has-results::after{opacity:1}
    .reading-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }.reading-title { margin:4px 0 0; font-size:20px; color:var(--cream); }.status { position:relative; display:inline-flex; align-items:center; gap:8px; padding:9px 11px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:var(--muted); font-size:11px; white-space:nowrap; }.status-dot { width:8px; height:8px; border-radius:50%; background:var(--mint); box-shadow:0 0 15px rgba(169,234,213,.75); }.status.is-busy{animation:pulseGlow 1.6s ease-in-out infinite}
    .deck { position:relative; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:15px; }.card { position:relative; min-height:252px; border-radius:20px; perspective:1200px; opacity:0; transform:translateY(18px) scale(.97); animation:dealIn .65s ease forwards; animation-delay:calc(var(--card-index,0)*120ms); }.card-shell { position:relative; min-height:252px; border-radius:20px; border:1px solid rgba(255,255,255,.1); overflow:hidden; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.2,.7,.2,1),box-shadow .4s,border-color .4s; background:linear-gradient(160deg,#2b2150,#100d24); box-shadow:0 19px 30px rgba(1,1,8,.38); }.card.revealed .card-shell { transform:rotateY(180deg) translateY(-2px); border-color:rgba(236,200,121,.5); box-shadow:0 25px 45px rgba(1,1,8,.55),0 0 0 1px rgba(236,200,121,.1) inset; }.card-frame { position:absolute; inset:9px; border:1px solid rgba(236,200,121,.24); border-radius:14px; }.card-back,.card-front { position:absolute; inset:0; padding:18px; display:flex; flex-direction:column; justify-content:space-between; backface-visibility:hidden; }.card-back { align-items:center; justify-content:center; text-align:center; color:var(--muted); gap:14px; background:radial-gradient(circle at 50% 30%,rgba(236,200,121,.18),transparent 30%),linear-gradient(160deg,#2d2253,#110d26); }.card-front { transform:rotateY(180deg); background:radial-gradient(circle at 50% 8%,rgba(236,200,121,.13),transparent 35%),linear-gradient(160deg,#231943,#100d20); }.sigil { width:74px; height:74px; border-radius:50%; border:1px solid rgba(236,200,121,.4); display:grid; place-items:center; color:var(--gold); font-size:29px; background:rgba(255,255,255,.035); box-shadow:0 0 30px rgba(236,200,121,.15),inset 0 0 24px rgba(255,255,255,.05); }.sigil-text { font-family:Arial,sans-serif; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.54); }.position-tag,.orientation-tag { display:inline-flex; padding:6px 9px; border-radius:999px; font-family:Arial,sans-serif; font-size:10px; letter-spacing:.08em; align-self:flex-start; }.position-tag { background:rgba(201,185,255,.17); color:#e0d9ff; }.orientation-tag { background:rgba(255,159,181,.12); color:#ffc0ce; border:1px solid rgba(255,159,181,.22); }.card-name-zh { margin:0; color:#f6dfad; font-size:24px; }.card-name-en { margin:6px 0 0; color:var(--muted); font-family:Arial,sans-serif; font-size:11px; letter-spacing:.06em; }.card-meaning { margin-top:12px; color:#e3dff0; line-height:1.75; font-size:13px; }
    .reading { position:relative; display:grid; gap:11px; }.reading-box h3 { margin:0 0 8px; color:var(--gold); font-size:16px; }.reading-box p,.reading-box li { color:#e4dfee; line-height:1.85; margin:0; font-size:14px; }.reading-box ul { margin:0; padding-left:19px; }.reading-box { opacity:0; transform:translateY(14px); animation:stageIn .55s ease forwards; animation-delay:calc(var(--reading-index,0)*90ms); }.error { color:var(--danger); min-height:20px; margin-top:10px; font-size:13px; }.reading-empty { position:relative; padding:21px; border-radius:17px; background:rgba(6,4,15,.24); border:1px dashed rgba(236,200,121,.23); color:var(--muted); line-height:1.8; font-size:14px; }
    @keyframes splitReveal{0%{opacity:0;transform:translateY(-.42em) scaleY(.06);filter:blur(7px)}48%{opacity:1;transform:translateY(.07em) scaleY(1.08);filter:blur(0)}100%{transform:translateY(0) scaleY(1)}}@keyframes borderOrbit{to{transform:rotate(1turn)}}@keyframes dealIn{from{opacity:0;transform:translateY(18px) scale(.97) rotate(-1.5deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0)}}@keyframes stageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(169,234,213,0)}50%{box-shadow:0 0 24px rgba(169,234,213,.16)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
    @media(max-width:940px){.grid{grid-template-columns:1fr}.ritual{min-height:0}}@media(max-width:640px){.shell{width:min(100% - 20px,1180px);padding-top:15px}.nav-note{display:none}.hero{padding:62px 10px 44px}.hero::before{width:280px;height:280px}.panel-inner,.ritual{padding:23px 19px}.panel-title{font-size:25px}.spread-meta{grid-template-columns:1fr}.deck{grid-template-columns:1fr}.status{white-space:normal}.reading-header{align-items:center}.button{width:100%}}
  </style>
</head>
<body>
  <div class="shell" id="top">
    <nav class="site-nav" aria-label="網站導覽">
      <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true">☾</span><span>ARCANA STUDIO</span></a>
      <span class="nav-note">reflect · reveal · return</span>
    </nav>
    <section class="hero">
      <div class="eyebrow">給自己的片刻指引</div>
      <h1 aria-label="神秘塔羅"><span class="title-glyph" style="--glyph-index:0">神</span><span class="title-glyph" style="--glyph-index:1">秘</span><span class="title-glyph" style="--glyph-index:2">塔</span><span class="title-glyph" style="--glyph-index:3">羅</span></h1>
      <p class="subtitle">把問題放在心上，讓牌面替你照亮現在的節點。不是替你決定，而是陪你看見下一步。</p>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-inner">
          <p class="section-kicker">01 · SET YOUR INTENTION</p>
          <h2 class="panel-title">開始占卜</h2>
          <p class="panel-copy">選擇一種觀看方式，寫下此刻真正想問的事。答案不必完美，真實就足夠。</p>

          <div class="field">
            <label for="spread">牌陣</label>
            <select id="spread"></select>
          </div>

          <div class="field">
            <label for="question">你的問題</label>
            <textarea id="question" placeholder="例如：我接下來三個月最該專注的是什麼？"></textarea>
          </div>

          <div class="field">
            <label>靈感提問</label>
            <div class="chips" id="categoryChips"></div>
            <div class="question-list" id="questionList"></div>
          </div>

          <div class="spread-meta">
            <div class="meta-card"><div class="meta-label">抽牌張數</div><div class="meta-value" id="metaCount">1 張</div></div>
            <div class="meta-card"><div class="meta-label">位置</div><div class="meta-value" id="metaPositions">核心訊息</div></div>
          </div>

          <div class="actions">
            <button class="button button-primary special-button" id="drawButton"><span class="button-text">抽牌解讀</span><span class="button-spark" aria-hidden="true">✦</span></button>
            <button class="button button-secondary" id="resetButton">重設</button>
          </div>
          <div class="error" id="errorMessage"></div>
        </div>
      </article>

      <aside class="panel">
        <div class="ritual">
          <div class="reading-header">
            <div><p class="section-kicker">02 · THE READING</p><h2 class="reading-title">牌面會在這裡展開</h2></div>
            <div class="status"><span class="status-dot"></span><span id="statusText">等待你提出問題</span></div>
          </div>
          <div class="deck" id="deck"></div>
          <div class="reading" id="reading"></div>
          <p class="footer-note">這份解讀提供的是反思與方向，不代替專業醫療、法律或財務建議。</p>
        </div>
      </aside>
    </section>
  </div>

  <script>
    const spreads = [
      { id: 'single', name: '單張指引', count: 1, positions: ['核心訊息'], description: '適合快速確認目前最重要的提醒。' },
      { id: 'timeline', name: '過去／現在／近期未來', count: 3, positions: ['過去脈絡', '當下狀態', '近期未來'], description: '適合用時間軸理解事情如何走到現在。' },
      { id: 'choice', name: '兩難抉擇', count: 3, positions: ['選項 A', '選項 B', '整體建議'], description: '適合在兩個方向之間做判斷。' }
    ];

    const promptGroups = [
      { category: '感情', questions: ['這段關係現在真正的核心是什麼？', '我該繼續等待，還是把重心拉回自己身上？', '這段關係接下來幾個月可能怎麼發展？'] },
      { category: '工作', questions: ['我在工作上卡住的真正原因是什麼？', '我該留在現在的環境，還是開始準備轉換？', '如果我想提升收入，最聰明的第一步是什麼？'] },
      { category: '自我', questions: ['我現在最需要放下的內在模式是什麼？', '在焦慮底下，我真正害怕的是什麼？', '我該如何重新建立更健康的節奏與界線？'] }
    ];

    const majorArcana = [
      ['the-fool', '愚者', 'The Fool', '新的開始', '勇敢走向未知，新的可能性正在打開。', '衝動或過度樂觀，可能讓你忽略必要的準備。'],
      ['the-magician', '魔術師', 'The Magician', '主動創造', '你手上其實已有資源，關鍵在於立即行動。', '能量分散、說得多做得少，需要把注意力收回。'],
      ['the-high-priestess', '女祭司', 'The High Priestess', '直覺', '放慢速度，傾聽內在真正知道的答案。', '過度觀望或把情緒藏太深，反而讓真相更模糊。'],
      ['the-empress', '皇后', 'The Empress', '滋養', '關係、創意與照顧能量正在成長。', '過度付出或沉溺舒適，會讓自己失去平衡。'],
      ['the-emperor', '皇帝', 'The Emperor', '秩序', '建立界線與規則，事情會更穩。', '控制慾過強，會讓關係和局勢變得僵硬。'],
      ['the-hierophant', '教皇', 'The Hierophant', '信念與方法', '找回可信的做法、制度或前輩指引。', '舊規則可能已不再適合現在的你。'],
      ['the-lovers', '戀人', 'The Lovers', '選擇', '真正的答案來自價值是否一致。', '猶豫與分裂感，讓簡單選擇也變困難。'],
      ['the-chariot', '戰車', 'The Chariot', '推進', '只要把力量對準方向，就能往前。', '用力過猛，反而掩蓋了內在衝突。'],
      ['strength', '力量', 'Strength', '溫柔的堅定', '真正的力量來自穩定與節制。', '壓抑太久的情緒，可能在不對的時候爆開。'],
      ['the-hermit', '隱者', 'The Hermit', '沉澱', '拉開距離後，你會看得更清楚。', '過度封閉，容易把思考變成停滯。'],
      ['wheel-of-fortune', '命運之輪', 'Wheel of Fortune', '轉變', '局勢正在移動，順勢調整比硬撐更有用。', '抗拒變化，只會增加不必要的摩擦。'],
      ['justice', '正義', 'Justice', '平衡與誠實', '誠實面對因果與責任，答案會更清楚。', '逃避代價，只會延後真正的解決。'],
      ['the-hanged-man', '吊人', 'The Hanged Man', '換個角度', '暫停不一定是失敗，也可能是在換視角。', '沒有方向的拖延，會把等待變成困住。'],
      ['death', '死神', 'Death', '結束與重生', '讓舊的階段結束，新的空間才會打開。', '不肯放手，會讓轉變變得更辛苦。'],
      ['temperance', '節制', 'Temperance', '調和', '把節奏調回平衡，局勢會重新流動。', '過量、極端與失衡，正在消耗你的能量。'],
      ['the-devil', '惡魔', 'The Devil', '執著與束縛', '先看見自己被什麼綁住，才能真正鬆開。', '恐懼、依附或慾望正在放大問題。'],
      ['the-tower', '高塔', 'The Tower', '破除幻象', '突然的變化是在逼你回到真相。', '拖越久，舊結構崩掉時的衝擊越大。'],
      ['the-star', '星星', 'The Star', '希望', '修復與清明正在慢慢回來。', '失望感可能比現實本身更重。'],
      ['the-moon', '月亮', 'The Moon', '模糊與潛意識', '現在不是所有事都看得清，先保持覺察。', '焦慮與投射可能扭曲了事實。'],
      ['the-sun', '太陽', 'The Sun', '明朗', '真相、溫暖與信心正逐漸靠近。', '只看樂觀面，可能會忽略細節。'],
      ['judgement', '審判', 'Judgement', '召喚', '你正被要求回應更深層的內在召喚。', '自責與反覆後悔，會讓你聽不見真正的訊息。'],
      ['the-world', '世界', 'The World', '完成', '一個循環即將完整收束，準備進入下一章。', '尾聲沒收好，新的開始就難以展開。']
    ];

    const suitProfiles = {
      Wands: { zh: '權杖', theme: '行動與熱情', upright: '提醒你主動推進，把想法化為行動。', reversed: '拖延、躁進或疲乏，可能正在削弱你的火力。' },
      Cups: { zh: '聖杯', theme: '情感與關係', upright: '情緒、連結與內心需求是關鍵。', reversed: '情緒積壓或混亂，正在遮住問題核心。' },
      Swords: { zh: '寶劍', theme: '思考與決斷', upright: '把事實說清楚，判斷才會穩。', reversed: '過度思考，可能比現實本身更吵雜。' },
      Pentacles: { zh: '錢幣', theme: '現實與穩定', upright: '把注意力放回資源、身體與長期穩定。', reversed: '對安全感的壓力，正在打亂你的專注。' }
    };

    const ranks = [
      ['Ace', '一', '新的開端正在出現。', '機會已經出現，但還需要你真正接住。'],
      ['Two', '二', '重點在平衡、協調與選擇。', '猶豫太久，會讓能量停住。'],
      ['Three', '三', '合作、支持或初步成果開始浮現。', '與他人的落差，可能拖慢進展。'],
      ['Four', '四', '穩定與休整同樣重要。', '抓得太緊，會讓流動變少。'],
      ['Five', '五', '衝突會讓真正的缺口被看見。', '挫折雖然明顯，但它不是全貌。'],
      ['Six', '六', '修復、過渡或彼此支持是可能的。', '表面平靜下，可能還有未完成的事。'],
      ['Seven', '七', '現在特別需要策略與辨識力。', '注意力分散，會削弱你的判斷。'],
      ['Eight', '八', '專注投入後，進展會加快。', '卡住的不一定是能力，而可能是方向。'],
      ['Nine', '九', '你已經靠近結果，但壓力也很明顯。', '忽略疲憊，容易讓觀點失真。'],
      ['Ten', '十', '一個循環正走向高峰或收尾。', '負擔可能已經超過合理範圍。'],
      ['Page', '侍者', '新的訊息、態度或學習入口正在出現。', '不夠成熟或三分鐘熱度，可能是關鍵。'],
      ['Knight', '騎士', '推進、追求與行動正在主導局勢。', '太快或反覆不定，會造成消耗。'],
      ['Queen', '皇后', '成熟、細膩與內在掌握感會幫到你。', '情緒與照顧分寸失衡，需要重新校準。'],
      ['King', '國王', '現在需要穩住大局並做出成熟決定。', '控制與僵化，可能壓過了真正需求。']
    ];

    const deck = buildDeck();
    const spreadSelect = document.getElementById('spread');
    const questionInput = document.getElementById('question');
    const categoryChips = document.getElementById('categoryChips');
    const questionList = document.getElementById('questionList');
    const metaCount = document.getElementById('metaCount');
    const metaPositions = document.getElementById('metaPositions');
    const drawButton = document.getElementById('drawButton');
    const resetButton = document.getElementById('resetButton');
    const deckElement = document.getElementById('deck');
    const readingElement = document.getElementById('reading');
    const ritualElement = document.querySelector('.ritual');
    const statusText = document.getElementById('statusText');
    const errorMessage = document.getElementById('errorMessage');
    let activeCategory = promptGroups[0].category;
    let isLoading = false;

    renderSpreadOptions();
    renderPromptGroups();
    updateSpreadMeta();
    renderEmptyState();
    spreadSelect.addEventListener('change', updateSpreadMeta);
    drawButton.addEventListener('click', handleReading);
    resetButton.addEventListener('click', resetAll);

    function buildDeck() {
      const majors = majorArcana.map(([id, nameZh, nameEn, keywords, upright, reversed], index) => ({ id, nameZh, nameEn, arcana: 'Major', keywords, uprightBase: upright, reversedBase: reversed, order: index }));
      const minors = [];
      Object.entries(suitProfiles).forEach(([suitKey, suit]) => {
        ranks.forEach(([rankEn, rankZh, upright, reversed], index) => {
          minors.push({
            id: `${suitKey.toLowerCase()}-${rankEn.toLowerCase()}`,
            nameZh: `${suit.zh}${rankZh}`,
            nameEn: `${rankEn} of ${suitKey}`,
            arcana: 'Minor',
            keywords: suit.theme,
            uprightBase: `${upright} ${suit.upright}`,
            reversedBase: `${reversed} ${suit.reversed}`,
            order: index + 1
          });
        });
      });
      return [...majors, ...minors];
    }

    function renderSpreadOptions() {
      spreadSelect.innerHTML = spreads.map((spread) => `<option value="${spread.id}">${spread.name}</option>`).join('');
    }

    function renderPromptGroups() {
      categoryChips.innerHTML = promptGroups.map((group) => `<button class="chip ${group.category === activeCategory ? 'active' : ''}" data-category="${group.category}">${group.category}</button>`).join('');
      Array.from(categoryChips.querySelectorAll('.chip')).forEach((button) => {
        button.addEventListener('click', () => { activeCategory = button.dataset.category; renderPromptGroups(); });
      });
      const active = promptGroups.find((group) => group.category === activeCategory);
      questionList.innerHTML = active.questions.map((question) => `<button class="question-item" type="button">${question}</button>`).join('');
      Array.from(questionList.querySelectorAll('.question-item')).forEach((button) => {
        button.addEventListener('click', () => { questionInput.value = button.textContent.trim(); });
      });
    }

    function getCurrentSpread() { return spreads.find((spread) => spread.id === spreadSelect.value) || spreads[0]; }

    function updateSpreadMeta() {
      const spread = getCurrentSpread();
      metaCount.textContent = `${spread.count} 張`;
      metaPositions.textContent = spread.positions.join(' / ');
    }

    function renderEmptyState() {
      ritualElement.classList.remove('has-results');
      deckElement.innerHTML = '<article class="card" style="--card-index:0;"><div class="card-shell"><div class="card-back"><div class="card-frame"></div><div class="sigil">✦</div><strong>尚未抽牌</strong><span>選好牌陣、輸入問題後，就可以開始占卜。</span><div class="sigil-text">mystic tarot</div></div><div class="card-front"><div class="card-frame"></div></div></div></article>';
      readingElement.innerHTML = '<section class="reading-empty">選擇喜歡的牌陣，輸入你的問題後，右側會先翻牌，再顯示解讀內容。</section>';
    }

    async function handleReading() {
      if (isLoading) return;
      const question = questionInput.value.trim();
      if (!question) {
        errorMessage.textContent = '請先輸入你的問題。';
        return;
      }
      errorMessage.textContent = '';
      const spread = getCurrentSpread();
      const cards = drawCards(spread);
      setLoadingState(true);
      statusText.textContent = `占卜進行中：已翻開 ${spread.count} 張牌，正在整理解讀`;
      renderCards(cards);
      await revealCards(cards.length);
      const localReading = buildLocalReading(cards);
      try {
        const aiReading = await requestAiReading(question, spread, cards);
        renderReading(question, spread, cards, aiReading, true);
        statusText.textContent = `占卜完成：已使用 Gemini 生成解讀`;
      } catch (error) {
        console.error('Gemini 解讀失敗，改用本地備援：', error);
        renderReading(question, spread, cards, localReading, false);
        statusText.textContent = '占卜完成：目前顯示本地備援解讀';
      } finally {
        setLoadingState(false);
      }
    }

    function drawCards(spread) {
      const pool = [...deck];
      shuffle(pool);
      return spread.positions.map((position, index) => ({
        ...pool[index],
        index,
        position,
        reversed: Math.random() < 0.35,
        positionMeaning: getPositionMeaning(spread.id, position)
      }));
    }

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    function getPositionMeaning(spreadId, position) {
      const meanings = {
        single: { '核心訊息': '這是本次占卜最核心的訊息。' },
        timeline: {
          '過去脈絡': '顯示事情如何發展到現在。',
          '當下狀態': '指出此刻最重要的狀態。',
          '近期未來': '顯示若照目前節奏走下去，接下來可能的發展。'
        },
        choice: {
          '選項 A': '呈現第一個方向的氣氛、代價與成長性。',
          '選項 B': '呈現第二個方向的氣氛、代價與成長性。',
          '整體建議': '這不是替你做決定，而是提醒你該怎麼選。'
        }
      };
      return meanings[spreadId][position];
    }

    function renderCards(cards) {
      deckElement.innerHTML = cards.map((card) => `
        <article class="card" style="--card-index:${card.index || 0};" data-card-index="${card.index || 0}">
          <div class="card-shell">
            <div class="card-back">
              <div class="card-frame"></div>
              <div class="sigil">✦</div>
              <strong>${card.position}</strong>
              <span>輕觸命運，讓牌面慢慢翻開。</span>
              <div class="sigil-text">arcana</div>
            </div>
            <div class="card-front">
              <div class="card-frame"></div>
              <div>
                <div class="position-tag">${card.position}</div>
                ${card.reversed ? '<div class="orientation-tag" style="margin-top:10px;">逆位</div>' : ''}
              </div>
              <div>
                <h3 class="card-name-zh">${card.nameZh}</h3>
                <p class="card-name-en">${card.nameEn}</p>
                <p class="card-meaning">${card.reversed ? card.reversedBase : card.uprightBase}</p>
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    function renderReading(question, spread, cards, reading, usedAi) {
      ritualElement.classList.add('has-results');
      readingElement.innerHTML = `
        <section class="reading-box" style="--reading-index:0;"><h3>你的問題</h3><p>${escapeHtml(question)}</p></section>
        <section class="reading-box" style="--reading-index:1;"><h3>牌陣焦點</h3><p>${spread.description}</p><ul>${cards.map((card) => `<li><strong>${card.position}</strong>：${card.positionMeaning}</li>`).join('')}</ul></section>
        <section class="reading-box" style="--reading-index:2;"><h3>整體解讀</h3><p>${escapeHtml(reading.summary)}</p></section>
        <section class="reading-box" style="--reading-index:3;"><h3>下一步建議</h3><p>${escapeHtml(reading.action)}</p></section>
        <section class="reading-box" style="--reading-index:4;"><h3>需要留意</h3><p>${escapeHtml(reading.caution)}</p></section>
        <section class="reading-box" style="--reading-index:5;"><h3>解讀來源</h3><p>${usedAi ? '這次解讀來自 Gemini 後端。' : 'Gemini 目前不可用，這次顯示的是本地備援解讀。'}</p></section>
      `;
      ritualElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function buildSummary(cards) {
      const majorCount = cards.filter((card) => card.arcana === 'Major').length;
      const reversedCount = cards.filter((card) => card.reversed).length;
      const lead = cards[0];
      const intro = `${lead.nameZh} 作為起點，指出你現在最需要正視的主題是「${lead.keywords}」。這件事更需要清醒地看待，而不是靠習慣反應。`;
      let weight = '';
      if (majorCount >= 2) weight = '這組牌裡的大牌偏多，代表這不只是眼前的小波動，而是帶有明顯的人生課題。';
      else if (majorCount === 1) weight = '其中有一張大牌，表示這件事裡藏著一個關鍵轉折點。';
      else weight = '這組牌比較偏向日常層面的狀態，重點在於你如何處理眼前節奏。';
      let flow = '';
      if (reversedCount >= 2) flow = '逆位偏多，代表真正卡住你的，往往是內在阻力、拖延或情緒累積，而不完全是外在條件。';
      else if (reversedCount === 1) flow = '有一張逆位提醒你，問題的摩擦點可能更接近心態與時機，而不是表面局勢。';
      else flow = '整體正位較多，表示只要你對準核心，事情其實有往前的空間。';
      const positions = cards.map((card) => `${card.position} 出現 ${card.nameZh}：${card.reversed ? card.reversedBase : card.uprightBase}`).join(' ');
      return `${intro} ${weight} ${flow} ${positions}`;
    }

    function buildAction(cards) {
      const card = cards.find((item) => !item.reversed) || cards[0];
      return `先從「${card.position}」這一塊開始最有效。${card.nameZh} 給你的方向是：${card.uprightBase} 把這個提醒變成一個看得見的動作，例如說清需求、設下時限、整理資源，或停止一個一直消耗你的慣性。`;
    }

    function buildCaution(cards) {
      const reversedCard = cards.find((card) => card.reversed);
      if (reversedCard) {
        return `${reversedCard.nameZh} 的逆位是這次最需要留意的訊號：${reversedCard.reversedBase} 如果你只是一直在腦中反覆打轉，卻沒有回到現實確認狀況，焦慮會比問題本身長得更快。`;
      }
      return '整體走向不差，但也不要因為方向看起來順，就提早鬆手。真正穩定的結果，仍然需要節奏、誠實與好好收尾。';
    }

    function buildLocalReading(cards) {
      return {
        summary: buildSummary(cards),
        action: buildAction(cards),
        caution: buildCaution(cards)
      };
    }

    async function requestAiReading(question, spread, cards) {
      const response = await fetch('/api/reading', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question,
          spread: {
            id: spread.id,
            name: spread.name,
            description: spread.description,
            positions: spread.positions
          },
          cards: cards.map((card) => ({
            nameZh: card.nameZh,
            nameEn: card.nameEn,
            position: card.position,
            reversed: card.reversed,
            keywords: card.keywords,
            meaning: card.reversed ? card.reversedBase : card.uprightBase
          }))
        })
      });

      let payload = null;
      try {
        payload = await response.json();
      } catch {
        payload = null;
      }

      if (!response.ok) {
        throw new Error(payload?.error || 'Gemini API 請求失敗');
      }

      if (!payload?.summary || !payload?.action || !payload?.caution) {
        throw new Error('Gemini 回傳格式不完整');
      }

      return payload;
    }

    async function revealCards(count) {
      for (let i = 0; i < count; i += 1) {
        const card = deckElement.querySelector(`[data-card-index="${i}"]`);
        if (card) {
          card.classList.add('revealed');
        }
        await wait(320);
      }
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function setLoadingState(loading) {
      isLoading = loading;
      drawButton.disabled = loading;
      drawButton.classList.toggle('is-drawing', loading);
      drawButton.querySelector('.button-text').textContent = loading ? '正在翻閱牌面…' : '抽牌解讀';
      spreadSelect.disabled = loading;
      questionInput.disabled = loading;
      resetButton.disabled = loading;
      statusText.parentElement.classList.toggle('is-busy', loading);
    }

    function resetAll() {
      questionInput.value = '';
      errorMessage.textContent = '';
      statusText.textContent = '等待你提出問題';
      renderEmptyState();
    }

    function escapeHtml(value) {
      return value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }
  </script>
</body>
</html>
